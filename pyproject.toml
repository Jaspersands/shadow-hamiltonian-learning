[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-hamiltonian-learning"
version = "0.4.0"
description = "Classical shadows: randomised, derandomised and matchgate shadows, readout mitigation, Hamiltonian learning with exact gradients, EKF tracking and shadow process tomography"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Jasper Sands" }
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.scripts]
shadow-learn = "shadow_learning.cli:main"

[project.optional-dependencies]
cirq = ["cirq-core>=1.3.0"]            # ClassicalShadowsProtocol (circuit inputs)
jax = ["jax>=0.4.0"]                   # backend="jax" gradients
notebooks = ["matplotlib>=3.7.0", "jupyter"]
dev = [
    "cirq-core>=1.3.0",
    "jax>=0.4.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
